version: 2

models:
  - name: stg_packages
    description: One row per package (one arm of a headline test), from both dataset splits.
    columns:
      - name: test_id
        data_tests:
          - not_null
      - name: created_at
        data_tests:
          - not_null
      - name: impressions
        data_tests:
          - not_null
      - name: clicks
        data_tests:
          - not_null
      - name: dataset_split
        data_tests:
          - accepted_values:
              arguments:
                values: ["exploratory", "confirmatory"]